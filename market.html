<body>

<div class="blue-bar"></div> 
<div class="SRA">
  <img src="sra.png" alt="SRA" width="85" height="72">
</div>

<div class="marketbutton">
  <button onclick="redirectToHome()">Home</button>
</div>

<div class="input">
  <input type="text" id="newItem" placeholder="Enter new item">
  <button onclick="addItem()">Add Item</button>
</div>

<div id="arrayData" class="centered"></div>

<script>
  let cloud_data = [];

  function redirectToHome() {
    window.location.href = "index.html";
  }

  function modifytext() {
    document.write("hello");
  }

  function displayArrayData() {
    const arrayDataDiv = document.getElementById("arrayData");
    arrayDataDiv.innerHTML = cloud_data.join("<br>");
  }

  function addItem() {
    const newItem = document.getElementById("newItem").value;
    if (newItem) {
      cloud_data.push(newItem);
      displayArrayData();
      document.getElementById("newItem").value = "";
    }
  }
</script>

<div class="unput">
  <input type="text" id="removeItem" placeholder="Enter item to remove">
  <button onclick="removeItem()">Remove Item</button>
</div>

<script>
function removeItem() {
    const removeItem = document.getElementById("removeItem").value;
    const index = cloud_data.indexOf(removeItem);
    if (index !== -1) {
      cloud_data.splice(index, 1);
      displayArrayData();
      document.getElementById("removeItem").value = "";
    }
  }


  // Call the function to display the array data
  displayArrayData();
</script>
